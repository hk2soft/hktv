<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>لوحة التحكم</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>
<style>
:root{
  --bg:#0b0d12; --bg2:#12151d; --card:#181c26; --card2:#1f2431;
  --line:#2a3040; --text:#eef1f7; --muted:#8b93a7;
  --accent:#e50914; --accent2:#ff3d47; --ok:#2ecc71; --warn:#f5a623; --bad:#ff4d5a;
  --radius:14px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Tajawal',system-ui,sans-serif;min-height:100vh}
button,input,select,textarea{font-family:inherit;color:inherit;font-size:inherit}
button{cursor:pointer;border:0;background:none}
a{color:inherit;text-decoration:none}
.hidden{display:none!important}

.center{min-height:100vh;display:grid;place-items:center;padding:16px;
  background:radial-gradient(1000px 500px at 80% -10%,#3a0a10 0%,transparent 60%),radial-gradient(800px 400px at 0% 110%,#0d1f3a 0%,transparent 60%),var(--bg)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius)}
.login{width:100%;max-width:400px;padding:32px 26px}
.login h1{font-size:23px;margin:14px 0 4px;text-align:center}
.login>p{color:var(--muted);text-align:center;margin-bottom:12px}
.brand-icon{width:44px;height:44px;border-radius:12px;background:linear-gradient(135deg,var(--accent),#8b0000);display:grid;place-items:center;flex-shrink:0}
.login .brand-icon{margin:0 auto}
label.f{display:block;font-size:13px;color:var(--muted);margin:14px 0 6px}
.inp{width:100%;padding:11px 12px;background:var(--bg2);border:1px solid var(--line);border-radius:10px;outline:none}
.inp:focus{border-color:var(--accent)}
textarea.inp{resize:vertical;line-height:1.6}
.ltr{direction:ltr;text-align:left}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:10px 16px;border-radius:10px;background:var(--card2);border:1px solid var(--line);font-weight:600;white-space:nowrap;transition:.15s}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.12)}
.btn.green{background:#1fa855;border-color:#1fa855}
.btn.danger{color:var(--bad)}
.btn.sm{padding:7px 12px;font-size:13px}
.btn.block{width:100%;margin-top:20px;padding:13px}
.btn:disabled{opacity:.5;cursor:wait}
.ibtn{width:34px;height:34px;display:grid;place-items:center;border-radius:9px;color:var(--muted);transition:.15s;flex-shrink:0}
.ibtn:hover{background:var(--card2);color:var(--text)}
.ibtn.danger:hover{color:var(--bad)}
.msg{min-height:20px;margin-top:12px;font-size:14px;color:var(--bad);text-align:center}

/* ---------- الهيكل ---------- */
#appView{display:grid;grid-template-columns:236px 1fr;min-height:100vh}
.pubbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 16px;border-radius:var(--radius);margin-bottom:18px;border:1px solid var(--line);background:var(--card)}
.pubbar.dirty{border-color:rgba(245,166,35,.5);background:rgba(245,166,35,.08)}
.pubbar.pending{border-color:rgba(80,140,255,.5);background:rgba(80,140,255,.08)}
.pubbar .t{margin-inline-end:auto;font-weight:600}
.pubbar small{display:block;color:var(--muted);font-weight:400}
ol.howto{line-height:2.1;padding-inline-start:22px;margin-top:12px}
ol.howto b{color:var(--text)}
.side{background:var(--bg2);border-inline-end:1px solid var(--line);padding:18px 12px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh}
.side .brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px;padding:0 6px 18px}
.side .brand .brand-icon{width:36px;height:36px;border-radius:10px}
.nav{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:10px;color:var(--muted);font-weight:600;width:100%;text-align:right;white-space:nowrap}
.nav:hover{background:var(--card);color:var(--text)}
.nav.active{background:rgba(229,9,20,.14);color:var(--text)}
.nav .cnt{margin-inline-start:auto;font-size:12px;background:var(--card2);padding:1px 8px;border-radius:99px}
.side-foot{margin-top:auto;border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:4px}
.who{font-size:12px;color:var(--muted);direction:ltr;text-align:right;overflow:hidden;text-overflow:ellipsis;padding:0 12px 6px}
.content{padding:24px;min-width:0}
.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.toolbar h2{font-size:22px;margin-inline-end:auto}
.toolbar .inp{width:auto;min-width:210px}

/* ---------- الإحصائيات ---------- */
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:12px;margin-bottom:20px}
.stat{padding:16px}
.stat .n{font-size:28px;font-weight:800;line-height:1.2}
.stat .l{color:var(--muted);font-size:13px}
.stat.ok .n{color:var(--ok)} .stat.warn .n{color:var(--warn)} .stat.bad .n{color:var(--bad)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.panel{padding:18px}
.panel h3{font-size:16px;margin-bottom:10px}
.mini{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.mini:last-child{border:0}
.mini small{color:var(--muted)}
.empty{color:var(--muted);text-align:center;padding:28px 10px;line-height:1.8}
.steps{line-height:2;color:var(--muted);padding-inline-start:20px}
.steps b{color:var(--text)}

.badge{display:inline-block;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:700;white-space:nowrap}
.badge.ok{background:rgba(46,204,113,.15);color:var(--ok)}
.badge.warn{background:rgba(245,166,35,.15);color:var(--warn)}
.badge.bad{background:rgba(255,77,90,.15);color:var(--bad)}
.badge.off{background:var(--card2);color:var(--muted)}
.tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:6px;background:var(--card2);margin:2px}

/* ---------- جدول الأكواد ---------- */
.table{overflow:hidden}
.crow{display:grid;grid-template-columns:1.4fr 1.1fr 1fr .6fr .9fr .75fr auto;gap:12px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}
.crow:last-child{border:0}
.crow.head{color:var(--muted);font-size:12px;font-weight:700;background:var(--bg2)}
.crow small{display:block;color:var(--muted);font-size:12px}
.code{font-family:ui-monospace,Consolas,monospace;font-weight:700;letter-spacing:1px;direction:ltr;display:inline-block}
.acts{display:flex;gap:1px;justify-content:flex-end}

/* ---------- الباقات ---------- */
.pk-layout{display:grid;grid-template-columns:250px 1fr;gap:16px;align-items:start}
.pk-list{padding:10px}
.pk{display:flex;justify-content:space-between;align-items:center;width:100%;padding:11px 12px;border-radius:10px;text-align:right;border:1px solid transparent;gap:8px}
.pk:hover{background:var(--card2)}
.pk.active{border-color:var(--accent);background:rgba(229,9,20,.1)}
.pk small{color:var(--muted);white-space:nowrap}
.pk-detail{padding:16px;min-width:0}
.pd-head{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.pd-name{flex:1;min-width:170px;font-size:17px;font-weight:700}
.pd-bar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:10px;font-size:13px;color:var(--muted)}
.pd-bar .inp{max-width:280px}
.chrow{display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:10px}
.chrow:hover{background:var(--bg2)}
.chrow.off .logo,.chrow.off .chinfo{opacity:.45}
.logo{width:40px;height:40px;border-radius:9px;background:var(--card2);display:grid;place-items:center;overflow:hidden;flex-shrink:0;font-weight:800;color:var(--muted)}
.logo img{width:100%;height:100%;object-fit:contain;padding:3px}
.chinfo{flex:1;min-width:0}
.chinfo b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.chinfo small{color:var(--muted);font-size:12px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;background:var(--line)}
.dot.ok{background:var(--ok)} .dot.fail{background:var(--bad)} .dot.http{background:var(--warn)} .dot.wait{background:var(--muted);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.25}}
.switch{position:relative;width:38px;height:22px;flex-shrink:0;display:inline-block}
.switch input{opacity:0;width:0;height:0}
.switch span{position:absolute;inset:0;background:var(--card2);border:1px solid var(--line);border-radius:99px;transition:.2s;cursor:pointer}
.switch span::after{content:"";position:absolute;top:2px;right:2px;width:16px;height:16px;border-radius:50%;background:var(--muted);transition:.2s}
.switch input:checked+span{background:var(--ok);border-color:var(--ok)}
.switch input:checked+span::after{transform:translateX(-16px);background:#fff}

/* ---------- النوافذ ---------- */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.72);display:grid;place-items:center;padding:16px;z-index:50;overflow:auto}
.mbox{width:100%;max-width:580px;padding:22px;max-height:calc(100vh - 32px);overflow:auto}
.mbox h3{font-size:19px;margin-bottom:4px}
.mbox .sub{color:var(--muted);font-size:14px}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.checks{display:flex;flex-wrap:wrap;gap:8px}
.check{display:inline-flex;align-items:center;gap:7px;padding:8px 12px;border:1px solid var(--line);border-radius:9px;background:var(--bg2);cursor:pointer;font-size:14px}
.check input{accent-color:var(--accent);width:16px;height:16px}
.check small{color:var(--muted)}
.mfoot{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap}
.codes-out{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-top:14px;max-height:280px;overflow:auto;direction:ltr;text-align:left;font-family:ui-monospace,Consolas,monospace;line-height:1.9;font-weight:700;letter-spacing:1px}
.hint{font-size:12px;color:var(--muted);margin-top:6px;line-height:1.7}
.ext-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
.mbox video{width:100%;aspect-ratio:16/9;background:#000;border-radius:10px;margin-top:14px;display:block}

.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--card2);border:1px solid var(--line);padding:12px 20px;border-radius:12px;z-index:99;box-shadow:0 10px 30px rgba(0,0,0,.5);max-width:calc(100% - 32px)}
.toast.err{border-color:var(--bad)}

@media (max-width:1150px){
  .crow{grid-template-columns:1.3fr 1fr .6fr .8fr auto}
  .crow .c-pk,.crow .c-last{display:none}
}
@media (max-width:860px){
  #appView{grid-template-columns:1fr}
  .side{height:auto;flex-direction:row;align-items:center;overflow-x:auto;padding:8px;z-index:20;border:0;border-bottom:1px solid var(--line)}
  .side .brand{padding:0 4px}
  .side .brand span,.nav .cnt,.who{display:none}
  .nav{width:auto;padding:9px 11px}
  .side-foot{margin:0;border:0;padding:0;flex-direction:row}
  .content{padding:14px}
  .grid2,.pk-layout,.frow{grid-template-columns:1fr}
  .crow.head{display:none}
  .crow{grid-template-columns:1fr auto;gap:4px 10px}
  .crow>div{grid-column:1/-1}
  .crow>.c-main{grid-column:1}
  .crow>.c-st{grid-column:2;grid-row:1}
  .crow .c-pk,.crow .c-last{display:block}
  .acts{justify-content:flex-start;flex-wrap:wrap}
  .toolbar .inp{flex:1;min-width:140px}
  .chrow{flex-wrap:wrap}
  .chinfo{flex-basis:calc(100% - 70px)}
}
.crow.c5{grid-template-columns:1.4fr 1.2fr 1fr .8fr auto}
@media (max-width:1150px){.crow.c5{grid-template-columns:1.4fr 1fr .8fr auto}}
@media (max-width:860px){.crow.c5{grid-template-columns:1fr auto}}
</style>
</head>
<body>

<!-- ============ الدخول ============ -->
<section id="loginView" class="center">
  <form class="card login" id="loginForm">
    <div class="brand-icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><rect x="3" y="11" width="18" height="10" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></div>
    <h1 id="loginTitle">لوحة التحكم</h1>
    <p id="loginSub">أدخل كلمة مرور المدير</p>
    <label class="f">كلمة المرور</label>
    <input class="inp ltr" id="password" type="password" autocomplete="current-password" required>
    <div id="confirmWrap" class="hidden">
      <label class="f">تأكيد كلمة المرور</label>
      <input class="inp ltr" id="password2" type="password" autocomplete="new-password">
      <div class="hint">احفظ كلمة المرور جيدًا، فلا يمكن استرجاعها إذا نسيتها.</div>
    </div>
    <button class="btn primary block" id="loginBtn" type="submit">دخول</button>
    <div class="msg" id="loginMsg"></div>
  </form>
</section>

<!-- ============ اللوحة ============ -->
<div id="appView" class="hidden">
  <aside class="side">
    <div class="brand"><div class="brand-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="#fff"><path d="M21 6h-7.6l3.3-3.3-.7-.7L12 6 8 2l-.7.7L10.6 6H3a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h18a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2zm0 14H3V8h18v12zM9 10v8l7-4z"/></svg></div><span id="brandName">تلفازي</span></div>
    <button class="nav active" data-view="codes"><span data-ico="key"></span>الأكواد<span class="cnt" id="nCodes">0</span></button>
    <button class="nav" data-view="pkgs"><span data-ico="tv"></span>الباقات والقنوات<span class="cnt" id="nPkgs">0</span></button>
    <button class="nav" data-view="settings"><span data-ico="gear"></span>الإعدادات</button>
    <div class="side-foot">
      <a class="nav" href="./" target="_blank"><span data-ico="ext"></span>فتح الموقع</a>
      <button class="nav" id="logoutBtn"><span data-ico="out"></span>خروج</button>
    </div>
  </aside>

  <main class="content">
    <div class="pubbar" id="pubbar"></div>

    <section id="v-codes">
      <div class="stats" id="stats"></div>
      <div class="toolbar">
        <h2>أكواد الزوار</h2>
        <input class="inp" id="codeSearch" type="search" placeholder="بحث بالكود أو الاسم أو الرقم...">
        <select class="inp" id="codeFilter">
          <option value="all">كل الحالات</option>
          <option value="active">فعّالة</option>
          <option value="expiring">تنتهي قريبًا</option>
          <option value="expired">منتهية</option>
          <option value="disabled">موقوفة</option>
        </select>
        <button class="btn primary" id="newCodeBtn"><span data-ico="plus"></span>إنشاء أكواد</button>
      </div>
      <div class="card table" id="codesList"></div>
    </section>

    <section id="v-pkgs" class="hidden">
      <div class="toolbar">
        <h2>الباقات والقنوات</h2>
        <button class="btn primary" id="newPkgBtn"><span data-ico="plus"></span>باقة جديدة</button>
      </div>
      <div class="pk-layout">
        <div class="card pk-list" id="pkgList"></div>
        <div class="card pk-detail" id="pkgDetail"></div>
      </div>
    </section>

    <section id="v-settings" class="hidden"></section>
  </main>
</div>

<script>
/* ================= أدوات ================= */
const $ = id => document.getElementById(id);
const h = s => String(s ?? '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const DAY = 864e5;
const normCode = s => String(s || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
const fmtCode = c => c.length > 4 ? c.match(/.{1,4}/g).join('-') : c;
const ALPH = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789';
function genCode(len, prefix){
  const a = new Uint32Array(len); crypto.getRandomValues(a);
  return normCode(prefix) + [...a].map(x => ALPH[x % ALPH.length]).join('');
}
const rid = () => Math.random().toString(36).slice(2, 10);
const dfmt = new Intl.DateTimeFormat('ar-u-nu-latn', { year:'numeric', month:'short', day:'numeric' });
const store = {
  get(k, d=null){ try{ const v = localStorage.getItem(k); return v===null ? d : JSON.parse(v); }catch{ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); return true; }catch{ return false; } },
  del(k){ try{ localStorage.removeItem(k); }catch{} }
};

const ICONS = {
  key:'<circle cx="8" cy="15" r="4"/><path d="m10.8 12.2 9.2-9.2M17 6l3 3M15 8l2 2"/>',
  tv:'<rect x="2" y="7" width="20" height="14" rx="2"/><path d="m17 2-5 5-5-5"/>',
  gear:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/>',
  ext:'<path d="M14 3h7v7M10 14 21 3M21 14v5a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5"/>',
  out:'<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  copy:'<rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1"/>',
  share:'<path d="M21 11.5a8.4 8.4 0 0 1-12.4 7.4L3 21l2.1-5.6A8.4 8.4 0 1 1 21 11.5z"/>',
  clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  power:'<path d="M12 2v10"/><path d="M18.4 6.6a9 9 0 1 1-12.8 0"/>',
  edit:'<path d="M4 20h4L20 8l-4-4L4 16z"/>',
  trash:'<path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>',
  play:'<path d="M7 4l13 8-13 8z"/>',
  up:'<path d="M12 19V5M5 12l7-7 7 7"/>',
  down:'<path d="M12 5v14M5 12l7 7 7-7"/>',
  upload:'<path d="M12 15V3M7 8l5-5 5 5M4 15v4a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-4"/>',
  download:'<path d="M12 3v12M7 10l5 5 5-5M4 15v4a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-4"/>',
  pulse:'<path d="M3 12h4l3-8 4 16 3-8h4"/>',
  check:'<path d="M20 6 9 17l-5-5"/>',
  refresh:'<path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/>'
};
const ico = (n, s = 18) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ICONS[n]}</svg>`;
document.querySelectorAll('[data-ico]').forEach(el => el.outerHTML = ico(el.dataset.ico));

function toast(text, err = false){
  document.querySelectorAll('.toast').forEach(x => x.remove());
  const t = document.createElement('div'); t.className = 'toast' + (err ? ' err' : ''); t.textContent = text;
  document.body.appendChild(t); setTimeout(() => t.remove(), err ? 5000 : 2600);
}
async function copyText(t){
  try{ await navigator.clipboard.writeText(t); }
  catch{ const a = document.createElement('textarea'); a.value = t; document.body.appendChild(a); a.select(); document.execCommand('copy'); a.remove(); }
}
function download(name, text, type = 'text/plain'){
  const url = URL.createObjectURL(new Blob([text], { type: type + ';charset=utf-8' }));
  const a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1500);
}
function modal(html){
  const m = document.createElement('div'); m.className = 'modal';
  m.innerHTML = `<div class="card mbox">${html}</div>`;
  const close = () => { m.dispatchEvent(new Event('closed')); m.remove(); };
  m.close = close;
  m.addEventListener('mousedown', e => { if (e.target === m) close(); });
  m.querySelectorAll('[data-close]').forEach(b => b.onclick = close);
  document.body.appendChild(m);
  return m;
}
document.addEventListener('keydown', e => { if (e.key === 'Escape'){ const all = document.querySelectorAll('.modal'); if (all.length) all[all.length - 1].close(); } });

function logoHTML(c){
  const initial = h((c.name || '?').trim().charAt(0).toUpperCase()).replace(/'/g, '');
  if (!c.logo) return initial;
  return `<img loading="lazy" src="${h(c.logo)}" alt="" onerror="this.replaceWith(document.createTextNode('${initial}'))">`;
}
function parseM3U(text){
  const out = []; let info = null;
  for (const raw of text.split(/\r?\n/)){
    const line = raw.trim(); if (!line) continue;
    if (line.startsWith('#EXTINF')){
      const attrs = {};
      line.replace(/([\w-]+)="([^"]*)"/g, (_, k, v) => { attrs[k.toLowerCase()] = v; });
      const name = line.substring(line.lastIndexOf(',') + 1).trim();
      info = { name: name || attrs['tvg-name'] || 'قناة', logo: attrs['tvg-logo'] || '', group: (attrs['group-title'] || 'عام').split(';')[0] || 'عام' };
    } else if (line.startsWith('#EXTGRP:') && info){ info.group = line.slice(8).trim() || info.group; }
    else if (!line.startsWith('#') && info){ out.push({ ...info, url: line }); info = null; }
  }
  return out;
}

/* ================= التشفير ================= */
const enc = new TextEncoder(), dec = new TextDecoder();
function toB64(buf){ const b = new Uint8Array(buf); let s = ''; for (let i = 0; i < b.length; i += 0x8000) s += String.fromCharCode.apply(null, b.subarray(i, i + 0x8000)); return btoa(s); }
const fromB64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const randBytes = n => crypto.getRandomValues(new Uint8Array(n));
const hex = b => [...b].map(x => x.toString(16).padStart(2, '0')).join('');
async function sha256(t){ return hex(new Uint8Array(await crypto.subtle.digest('SHA-256', enc.encode(t)))); }
async function deriveKey(pass, salt){
  const base = await crypto.subtle.importKey('raw', enc.encode(pass), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name:'PBKDF2', salt, iterations:250000, hash:'SHA-256' }, base, { name:'AES-GCM', length:256 }, false, ['encrypt','decrypt']);
}

function statusOf(c){
  if (!c.active) return 'disabled';
  if (c.expiresAt && c.expiresAt <= Date.now()) return 'expired';
  if (c.expiresAt && c.expiresAt - Date.now() < 7 * DAY) return 'expiring';
  return 'active';
}
function expText(c){
  if (!c.expiresAt) return { main:'غير محدود', sub:'' };
  const d = Math.ceil((c.expiresAt - Date.now()) / DAY);
  return { main: dfmt.format(c.expiresAt), sub: d > 0 ? `متبقٍ ${d} يوم` : 'منتهي' };
}

$('loginForm').addEventListener('submit', async e => {
  e.preventDefault();
  const pass = $('password').value, btn = $('loginBtn'), m = $('loginMsg');
  m.textContent = ''; btn.disabled = true;
  try{
    if (!FILE.admin){
      if (pass.length < 6) throw new Error('كلمة المرور يجب أن تكون 6 أحرف على الأقل');
      if (pass !== $('password2').value) throw new Error('كلمتا المرور غير متطابقتين');
      KDF_SALT = toB64(randBytes(16));
      KEY = await deriveKey(pass, fromB64(KDF_SALT));
      S = emptyState(); curRev = FILE.rev || 0; dirty = true;
      saveDraft();
    } else {
      KDF_SALT = FILE.admin.salt;
      try{
        KEY = await deriveKey(pass, fromB64(KDF_SALT));
        const pt = await crypto.subtle.decrypt({ name:'AES-GCM', iv: fromB64(FILE.admin.iv) }, KEY, fromB64(FILE.admin.data));
        S = JSON.parse(dec.decode(pt));
      }catch{ throw new Error('كلمة المرور غير صحيحة'); }
      curRev = FILE.rev || 0; dirty = false; pendingRev = 0;
      const d = store.get(DRAFT);
      if (d && d.kdf === KDF_SALT && d.state && d.rev >= curRev){
        S = d.state; dirty = !!d.dirty;
        if (d.rev > curRev) pendingRev = d.rev;
        curRev = d.rev;
      }
    }
    startApp();
  }catch(err){ m.textContent = err.message; }
  finally{ btn.disabled = false; }
});

let lastBuilt = null;
async function buildData(rev){
  const codes = {};
  for (const c of S.codes) codes[await sha256(S.salt + c.code)] = { e: c.expiresAt || null, p: c.packages, a: c.active ? 1 : 0 };
  const packages = {};
  S.packages.forEach(p => packages[p.id] = {
    name: p.name,
    channels: (p.channels || []).filter(c => c.active !== false).map(c => ({ n: c.name, u: c.url, l: c.logo || '', g: c.group || '' }))
  });
  const iv = randBytes(12);
  const ct = await crypto.subtle.encrypt({ name:'AES-GCM', iv }, KEY, enc.encode(JSON.stringify(S)));
  const s = S.site;
  return {
    rev, updated: new Date().toISOString(),
    site: { siteName: s.siteName || '', announcement: s.announcement || '', whatsapp: s.whatsapp || '', contactText: s.contactText || '' },
    salt: S.salt, codes, packages,
    admin: { salt: KDF_SALT, iv: toB64(iv), data: toB64(ct) }
  };
}

async function publish(again = false){

      const rev = curRev + 1;
      lastBuilt = JSON.stringify(await buildData(rev));

    }
    download('data.json', lastBuilt, 'application/json');
    renderPubbar();

function calcExp(dur, date){
  if (dur === 'none') return null;
  if (dur === 'custom') return new Date(date + 'T23:59:59').getTime();
  return Date.now() + Number(dur) * DAY;
}

    } else {
      const count = Math.min(200, Math.max(1, parseInt(fd.get('count')) || 1));
      while (ids.length < count){ const k = genCode(Number(fd.get('len')), fd.get('prefix')); if (!taken.has(k) && !ids.includes(k)) ids.push(k); }
    }
    const now = Date.now();
    ids.forEach((code, i) => S.codes.push({ code, ...base, active: true, expiresAt: exp, createdAt: now + i }));
    m.close(); changed(); resultModal(ids, base, exp);
  };
}

      let text = '';
      if (file) text = await file.text();
      else if (paste) text = paste;
      else if (url){
        try{ const r = await fetch(url); if (!r.ok) throw 0; text = await r.text(); }
        catch{ throw new Error('تعذّر جلب الرابط من المتصفح (غالبًا بسبب حماية CORS). نزّل الملف على جهازك وارفعه بدلًا من ذلك.'); }
      } else throw new Error('اختر قائمة جاهزة أو أدخل رابطًا أو ارفع ملفًا');
      let list = parseM3U(text);
      if (!list.length) throw new Error('لم يتم العثور على قنوات في الملف');
      let skipped = 0;
      if (f.elements.https.checked){ const n = list.length; list = list.filter(c => !/^http:/i.test(c.url)); skipped = n - list.length; }

      m.close(); changed();
      toast(`تم استيراد ${added} قناة` + (skipped ? ` · تم تجاهل ${skipped} رابط http` : ''));
    }catch(err){ sb.disabled = false; toast(err.message, true); }
  };
}

async function checkChannels(p){
  if (ui.checking) return toast('الفحص قيد التشغيل...');
  const list = p.channels || []; if (!list.length) return;
  ui.checking = true;
  let done = 0, ok = 0, bad = 0;
  const info = () => { const el = $('checkInfo'); if (el) el.innerHTML = `فحص ${done}/${list.length} · <span style="color:var(--ok)">${ok} يعمل</span> · <span style="color:var(--bad)">${bad} لا يعمل</span>`; };
  list.forEach(c => ui.chStatus[c.url] = 'wait'); renderChannels(); info();
  const queue = [...list];
  const worker = async () => {
    while (queue.length){
      const c = queue.shift(); let st;
      if (location.protocol === 'https:' && /^http:/i.test(c.url)) st = 'http';
      else {
        const ctl = new AbortController(), t = setTimeout(() => ctl.abort(), 8000);
        try{ const r = await fetch(c.url, { signal: ctl.signal }); st = r.ok ? 'ok' : 'fail'; }catch{ st = 'fail'; }
        clearTimeout(t); ctl.abort();
      }
      ui.chStatus[c.url] = st; done++; st === 'ok' ? ok++ : bad++;
      info(); if (done % 8 === 0) renderChannels();
    }
  };
  await Promise.all(Array.from({ length: 6 }, worker));
  ui.checking = false; renderChannels(); info();
  if (bad && $('checkInfo')) $('checkInfo').insertAdjacentHTML('beforeend', ` <button class="btn sm" data-a="disableBad">إخفاء غير العاملة (${bad})</button>`);
}

function testModal(c){
  if (!c) return;
  const m = modal(`<h3>${h(c.name || 'تجربة القناة')}</h3><p class="sub" id="tst">جارِ الاتصال...</p><video controls autoplay playsinline muted></video>
    <div class="mfoot"><button class="btn" data-close>إغلاق</button></div>`);
  const v = m.querySelector('video'), st = m.querySelector('#tst');
  let hls = null;
  v.addEventListener('playing', () => { st.textContent = '✅ القناة تعمل'; st.style.color = 'var(--ok)'; });
  const fail = t => { st.textContent = '❌ ' + t; st.style.color = 'var(--bad)'; };
  if (location.protocol === 'https:' && /^http:/i.test(c.url)) fail('رابط http لا يعمل على موقع https');
  else if (window.Hls && Hls.isSupported() && !/\.(mp4|webm)(\?|$)/i.test(c.url)){
    hls = new Hls(); hls.loadSource(c.url); hls.attachMedia(v);
    hls.on(Hls.Events.MANIFEST_PARSED, () => v.play().catch(() => {}));
    hls.on(Hls.Events.ERROR, (_, d) => { if (d.fatal) fail('القناة لا تعمل أو تمنع التشغيل من المتصفح'); });
  } else { v.src = c.url; v.onerror = () => fail('تعذّر تشغيل الرابط'); }
  m.addEventListener('closed', () => { if (hls) hls.destroy(); v.pause(); v.removeAttribute('src'); });
}

function deletePkg(p){
  const users = S.codes.filter(c => (c.packages || []).includes(p.id));
  if (!confirm(`حذف الباقة «${p.name}» و${p.channels.length} قناة؟` + (users.length ? `\nستُزال من ${users.length} كود.` : ''))) return;
  S.packages = S.packages.filter(x => x !== p);
  users.forEach(c => c.packages = c.packages.filter(id => id !== p.id));
  ui.selPkg = S.packages[0] ? S.packages[0].id : null; ui.renderedPkg = null;
  changed(); toast('تم حذف الباقة');
}

      <textarea class="inp" name="announcement" rows="2">${h(s.announcement)}</textarea>
      <div class="frow">
        <div><label class="f">رقم واتساب للتواصل</label><input class="inp ltr" name="whatsapp" value="${h(s.whatsapp)}" placeholder="9647XXXXXXXXX"></div>
        <div><label class="f">نص زر التواصل</label><input class="inp" name="contactText" value="${h(s.contactText)}" placeholder="للحصول على كود تواصل معنا عبر واتساب"></div>
      </div>
      <label class="f">المدة الافتراضية للأكواد الجديدة</label>
      <select class="inp" name="defaultDays">${DURATIONS.filter(d => d[0] !== 'custom').map(([v, l]) => `<option value="${v}" ${v === defDur ? 'selected' : ''}>${l}</option>`).join('')}</select>
      <label class="f">قالب رسالة العميل</label>
      <textarea class="inp" name="template" rows="7">${h(s.template || DEFAULT_TEMPLATE)}</textarea>
      <div class="hint">المتغيرات: {name} اسم العميل · {code} الكود · {link} رابط الموقع · {expiry} تاريخ الانتهاء · {site} اسم الموقع</div>
      <div class="mfoot"><button class="btn primary" type="submit">حفظ الإعدادات</button></div>
    </form>
    <form id="pwf" class="card panel" style="max-width:760px;margin-top:16px">
      <h3>تغيير كلمة مرور المدير</h3>
      <div class="frow">
        <div><label class="f">كلمة المرور الجديدة</label><input class="inp ltr" type="password" name="p1" autocomplete="new-password"></div>
        <div><label class="f">تأكيدها</label><input class="inp ltr" type="password" name="p2" autocomplete="new-password"></div>
      </div>
      <div class="mfoot"><button class="btn" type="submit">تغيير كلمة المرور</button></div>
    </form>
    <div class="card panel" style="max-width:760px;margin-top:16px">
      <h3>نسخة احتياطية</h3>
      <p class="hint" style="margin-bottom:12px">ملف فيه كل الأكواد وبيانات العملاء والقنوات (غير مشفّر). احتفظ به في مكان آمن ولا ترفعه على GitHub.</p>
      <button class="btn" id="backupBtn">${ico('download', 16)}تنزيل نسخة احتياطية</button>
    </div>`;
  $('sf').onsubmit = e => {
    e.preventDefault();
    const fd = new FormData(e.target);
    ['siteName','siteUrl','repoUrl','announcement','whatsapp','contactText','template','defaultDays'].forEach(k => S.site[k] = String(fd.get(k) || '').trim());
    S.site.whatsapp = S.site.whatsapp.replace(/\D/g, '');
    changed(); toast('تم حفظ الإعدادات');
  };
  $('pwf').onsubmit = async e => {
    e.preventDefault();
    const p1 = e.target.elements.p1.value, p2 = e.target.elements.p2.value;
    if (p1.length < 6) return toast('كلمة المرور يجب أن تكون 6 أحرف على الأقل', true);
    if (p1 !== p2) return toast('كلمتا المرور غير متطابقتين', true);
    KDF_SALT = toB64(randBytes(16));
    KEY = await deriveKey(p1, fromB64(KDF_SALT));
    e.target.reset(); changed();
    toast('تم التغيير. انشر التغييرات لتفعيل كلمة المرور الجديدة');
  };
  $('backupBtn').onclick = () => download(`backup-${new Date().toISOString().slice(0,10)}.json`, JSON.stringify(S, null, 2), 'application/json');
}

setInterval(() => { if (S && ui.view === 'codes') refresh(); }, 60000);
</script>
</body>
</html>
